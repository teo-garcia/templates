name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate Renovate preset
        env:
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: "44.65.0"
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" renovate-config-validator renovate/active.json

      - name: Check governance deadlines
        run: node conformance/governance/check.mjs

      - name: Checkout application delivery templates
        run: >-
          git -c 'url.https://github.com/.insteadOf=git@github.com:'
          submodule update --init nest-template-monolith
          adonis-template-monolith fastapi-template-monolith
          django-template-monolith spring-template-monolith
          gin-template-monolith next-template-fullstack
          react-router-template-fullstack tanstack-template-fullstack
          astro-template-fullstack expo-template-mobile

      - name: Check reusable delivery workflows
        run: node --test conformance/delivery/check.test.mjs && node conformance/delivery/check.mjs

      - name: Test backend conformance runner
        run: node --test conformance/backend/run.test.mjs

      - name: Check web conformance runner
        run: node --check conformance/web/run.mjs

  shared-node-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout shared packages and consumer
        run: git submodule update --init eslint-config-shared prettier-config-shared tsconfig-shared vitest-config-shared next-template-fullstack

      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: next-template-fullstack/pnpm-lock.yaml

      - name: Check packed Node packages in Next.js
        run: node conformance/shared-packages/node.mjs

  shared-python-consumer:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: fastapi_monolith_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v6

      - name: Checkout shared packages and consumer
        run: git submodule update --init ruff-config-shared mypy-config-shared pytest-config-shared fastapi-template-monolith

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: fastapi-template-monolith/uv.lock

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check Python wheels in FastAPI
        run: python conformance/shared-packages/python.py
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fastapi_monolith_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  shared-go-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use HTTPS for Go submodules
        run: >-
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout shared packages and consumer
        run: git submodule update --init golangci-config-shared gotest-config-shared gin-template-monolith

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: actions/setup-go@v6
        with:
          go-version-file: gin-template-monolith/go.mod
          cache-dependency-path: gin-template-monolith/go.sum

      - name: Check Go modules in Gin
        run: node conformance/shared-packages/go.mjs
