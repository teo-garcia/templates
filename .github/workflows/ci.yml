name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate Renovate preset
        env:
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: "44.65.0"
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" renovate-config-validator renovate/active.json

      - name: Test backend conformance runner
        run: node --test conformance/backend/run.test.mjs

      - name: Check web conformance runner
        run: node --check conformance/web/run.mjs
