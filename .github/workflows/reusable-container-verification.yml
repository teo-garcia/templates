name: Reusable Container Verification

on:
  workflow_call:
    inputs:
      target:
        description: Optional Dockerfile target stage
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify:
    name: Build and smoke production image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOCAL_IMAGE: local/${{ github.repository }}:ci

    steps:
      - name: Check out caller repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate smoke contract
        run: test -x .github/scripts/container-smoke.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ inputs.target }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke production image
        run: .github/scripts/container-smoke.sh "$LOCAL_IMAGE"
